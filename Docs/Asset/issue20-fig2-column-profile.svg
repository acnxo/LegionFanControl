="24.0" y="504.0" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">读法：原生那一行与掩码「同形」但取值形态不同（全为 765 的倍数），且总墨量超过掩码每像素最大值之和 —— 取样跨到了相邻像素并被累加。</text></svg>