name: CollectPredefinedClasses

# 手动触发的一次性采集作业：用 GraalVM 的 tracing agent 采集「运行期动态定义的类」
# （当前唯一已知案例 = com.sun.javafx.reflect.Trampoline），产出 predefined-classes-config.json，
# 供 native-image 用 -H:PredefinedClassesConfigurationFiles / 资源形式预定义进镜像。
#
# 为什么不在主构建里自动做：预定义清单是**入库的静态配置**（采集一次、长期复用），
# 采集结果需要人工过一眼再提交，所以做成独立的手动作业 + 产物上传。
#
# 为什么单独一个作业：只需要 fat jar，不需要 native-image 构建（后者比采集慢一个量级）。
#
# 详见 Docs/NativeImageCi.md 第 5 节第 21 条。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: SetupGraalvm
        uses: graalvm/setup-graalvm@v1
        with:
          # 与主构建保持一致，见 main.BuildReleaseWindowsX64.yml 的同名步骤注释
          version: '25.4'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: BuildFatJar
        shell: pwsh
        run: |
          & mvn -B -ntp -DskipTests package
          if ($LASTEXITCODE -ne 0) { throw "fat jar 构建失败" }
          if (-not (Test-Path 'target/LegionFanControl.jar')) { throw '未生成 target/LegionFanControl.jar' }

      - name: CollectPredefinedClasses
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # ① 定位 tracing agent 动态库（Linux 上它在 lib/ 下且不在默认库路径，Windows 同理，显式指路径最稳）
          $lib = Get-ChildItem -Path $env:JAVA_HOME -Recurse -File -Filter 'native-image-agent*' -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $lib) { throw "在 $env:JAVA_HOME 下找不到 native-image-agent 动态库" }
          Write-Host "tracing agent：$($lib.FullName)"

          # ② 编译采集探针（源码在仓库里，不进产品构建）
          $classes = Join-Path $env:RUNNER_TEMP 'probe-classes'
          New-Item -ItemType Directory -Force -Path $classes | Out-Null
          & javac -encoding UTF-8 -cp 'target/LegionFanControl.jar' -d $classes 'Script/FxmlLoadProbe.java'
          if ($LASTEXITCODE -ne 0) { throw '采集探针编译失败' }

          # ③ 跑探针并采集。两个要点：
          #    · --add-opens：JVM 上 JavaFX 的 defineClass 会被模块访问挡住，不加就采不到 Trampoline
          #    · 探针装载完 FXML 后 System.exit(0)：agent 在关闭钩子里落盘，强杀进程会丢结果
          $cfg = Join-Path $env:RUNNER_TEMP 'predefined'
          New-Item -ItemType Directory -Force -Path $cfg | Out-Null
          $agent = "config-output-dir=$cfg,experimental-class-define-support"
          & java "--add-opens" "java.base/java.lang=ALL-UNNAMED" `
                 "-agentpath:$($lib.FullName)=$agent" `
                 "-cp" "$classes;target/LegionFanControl.jar" `
                 "FxmlLoadProbe"
          if ($LASTEXITCODE -ne 0) { throw "采集探针退出码 $LASTEXITCODE（预期 0）" }

          # ④ 报告采集结果
          Write-Host '===== 采集产物 ====='
          Get-ChildItem -Path $cfg -File | ForEach-Object {
            Write-Host ("  · {0}：{1} 字节" -f $_.Name, $_.Length)
          }
          $pre = Join-Path $cfg 'predefined-classes-config.json'
          if (-not (Test-Path $pre)) {
            Write-Host '未产出 predefined-classes-config.json —— 打印 reachability-metadata.json 供排查：'
            $meta = Join-Path $cfg 'reachability-metadata.json'
            if (Test-Path $meta) { Get-Content -Raw $meta | Write-Host }
            throw '采集失败：没有 predefined-classes-config.json（说明本次运行没有真的在运行期定义类）'
          }
          Write-Host '采集成功：predefined-classes-config.json 已产出 ✅'
          Write-Host '--- 内容 ---'
          Get-Content -Raw $pre | Write-Host

      - name: UploadPredefinedConfig
        uses: actions/upload-artifact@v4
        with:
          name: predefined-classes-config
          path: ${{ runner.temp }}/predefined
          if-no-files-found: error
          retention-days: 14
