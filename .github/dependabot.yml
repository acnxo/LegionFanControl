# Dependabot 配置：每周检查并升级依赖
#
# 覆盖两类依赖：
#   1. Maven 依赖 —— pom.xml（版本集中在 <properties>，一次升级即覆盖全部依赖）
#   2. GitHub Actions 组件 —— .github/workflows/*.yml 中 uses: 引用的 action 版本
#
# 合入路径：Dependabot 的 PR 一律**先合入 dependa 分支**（配置里的 target-branch），
#           不直接指向默认分支；dependa 上积累并验证稳定后，再由 dependa → 默认分支单独提 PR。
#
#   dependabot/xxx ──PR──▶ dependa ──PR（人工发起）──▶ 默认分支
#
# 前置条件（缺任一条本文件都不生效，详见 Docs/ProjectStructure.md「依赖自动更新」）：
#   - 本文件必须位于**默认分支**（Dependabot 只从默认分支读取配置）；
#   - dependa 分支必须已存在，且其中的 pom.xml 与 .github/workflows/ 与默认分支一致
#     （指定 target-branch 后，Dependabot 读取的是**该分支**上的清单文件）。
#
# 检测频率：每周一次（两个生态都在周一 09:00 / Asia/Shanghai 触发）。
version: 2

updates:
  # ── Maven 依赖（pom.xml）──
  - package-ecosystem: maven
    directory: /
    target-branch: dependa
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
    labels:
      - dependencies
    groups:
      # minor + patch 合并为一个 PR，减少噪音；
      # major 不并入分组，逐个单独提 PR，便于先读上游变更说明再决定。
      maven-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ── GitHub Actions 组件（.github/workflows/）──
  - package-ecosystem: github-actions
    directory: /
    target-branch: dependa
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    commit-message:
      prefix: ci
    labels:
      - dependencies
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
